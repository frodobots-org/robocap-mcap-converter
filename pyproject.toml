[project]
name = "robocap-mcap-converter"
version = "0.2.1"
description = "Validate and convert raw RoboCap camera and IMU sessions to Foxglove MCAP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "FrodoBots"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "av>=14,<18",
    "boto3>=1.35,<2",
    "foxglove-schemas-protobuf>=0.3,<1",
    "mcap>=1.2,<2",
    "mcap-protobuf-support>=0.5,<1",
    "numpy>=2,<3",
    "protobuf>=6.31.1,<8",
]

[project.optional-dependencies]
desktop = [
    "platformdirs>=4.3,<5",
    "pyside6>=6.8,<7",
]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
robocap-mcap = "robocap_to_mcap.cli:main"
robocap-mcap-cloud = "robocap_to_mcap.container_cli:main"
robocap-to-mcap = "robocap_to_mcap.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robocap_to_mcap"]

[dependency-groups]
dev = ["pytest>=8,<9"]
