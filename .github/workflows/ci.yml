name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --extra desktop --group dev
      - run: uv run pytest -q
      - run: docker build -t robocap-mcap-converter:test .
      - run: docker run --rm robocap-mcap-converter:test version
